name: Browser Runtime Smoke Test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install browser harness
        run: npm install --no-save --no-package-lock playwright-core
      - name: Test browser runtime and capture screenshots
        run: node scripts/browser-smoke.mjs
      - name: Upload screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-smoke
          path: browser-smoke-*.png
          if-no-files-found: ignore
