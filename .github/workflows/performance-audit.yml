name: Audit Website Performance

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]

permissions:
  contents: read

jobs:
  lighthouse-mobile:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check optimized production images
        run: |
          curl --retry 3 --retry-delay 3 --fail --location --silent --show-error --head \
            https://ihan243.github.io/Hamburger/images/salchipapa-dish.webp
          curl --retry 3 --retry-delay 3 --fail --location --silent --show-error --head \
            https://ihan243.github.io/Hamburger/images/hercules-mascot.webp

      - name: Smoke-test rendered page
        continue-on-error: true
        run: |
          curl --fail --location --silent --show-error https://ihan243.github.io/Hamburger/ -o page.html
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --disable-gpu --virtual-time-budget=9000 --dump-dom \
            https://ihan243.github.io/Hamburger/ > rendered.html 2> chrome-errors.log || true
          node -e "const fs=require('fs');const p=fs.readFileSync('page.html','utf8');const r=fs.existsSync('rendered.html')?fs.readFileSync('rendered.html','utf8'):'';console.log('HTML',p.length,'RENDERED',r.length,'HERO',r.includes('ENVUELTO'),'ROOT',r.includes('id=\\\"root\\\"')); console.log(r.slice(0,350));"
          tail -n 28 chrome-errors.log || true

      - name: Run mobile Lighthouse
        continue-on-error: true
        run: |
          npx --yes lighthouse@12.8.2 \
            https://ihan243.github.io/Hamburger/ \
            --only-categories=performance,accessibility,best-practices,seo \
            --throttling-method=simulate \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --output=json \
            --output-path=./lighthouse-mobile.json \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage --disable-gpu" \
            --quiet

      - name: Summarize results and goals
        if: always()
        run: node scripts/report-lighthouse.mjs

      - name: Save audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: la-patata-lighthouse-mobile
          path: lighthouse-mobile.json
          if-no-files-found: ignore
